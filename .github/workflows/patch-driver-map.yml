name: Apply driver map patch

on:
  push:
    branches: [feature/delivery-zone-pricing]
    paths: [.github/workflows/patch-driver-map.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/delivery-zone-pricing
      - name: Patch order details
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/features/orders/driver_order_details_screen.dart')
          s = p.read_text()

          marker = "  Future<void> updateStatus(String status) async {"
          helper = r'''  double? _coordinate(Map<String, dynamic> order, List<String> keys) {
    final addressMaps = [
      order,
      _map(order['customerAddress']),
      _map(order['deliveryAddress']),
      _map(order['location']),
      _map(order['customerLocation']),
    ];
    for (final source in addressMaps) {
      for (final key in keys) {
        final value = double.tryParse(source[key]?.toString() ?? '');
        if (value != null && value != 0) return value;
      }
    }
    return null;
  }

  Future<void> openCustomerLocation(Map<String, dynamic> order) async {
    final lat = _coordinate(order, ['customerLat', 'latitude', 'lat']);
    final lng = _coordinate(order, ['customerLng', 'customerLon', 'longitude', 'lng', 'lon']);
    if (lat == null || lng == null) {
      _message('موقع العميل غير متاح لهذا الطلب');
      return;
    }
    final uri = Uri.parse('https://www.google.com/maps/dir/?api=1&destination=$lat,$lng');
    final opened = await launchUrl(uri, mode: LaunchMode.externalApplication);
    if (!opened && mounted) _message('تعذر فتح خرائط Google');
  }

'''
          if 'Future<void> openCustomerLocation' not in s:
              s = s.replace(marker, helper + marker)

          old = '''                    _customerCard(
                      name: customerName.isEmpty ? 'عميل Bringo' : customerName,
                      phone: phone,
                      address: address,
                    ),'''
          new = '''                    _customerCard(
                      name: customerName.isEmpty ? 'عميل Bringo' : customerName,
                      phone: phone,
                      address: address,
                      onOpenMap: () => openCustomerLocation(order),
                    ),'''
          s = s.replace(old, new)

          old_sig = '''  Widget _customerCard({
    required String name,
    required String phone,
    required String address,
  }) =>'''
          new_sig = '''  Widget _customerCard({
    required String name,
    required String phone,
    required String address,
    required VoidCallback onOpenMap,
  }) =>'''
          s = s.replace(old_sig, new_sig)

          anchor = '''            ),
          ],
        ),
      );

  Widget _contactCircle({'''
          button = '''            ),
            SizedBox(height: 10.h),
            InkWell(
              onTap: onOpenMap,
              borderRadius: BorderRadius.circular(14.r),
              child: Container(
                width: double.infinity,
                padding: EdgeInsets.symmetric(horizontal: 14.w, vertical: 12.h),
                decoration: BoxDecoration(
                  color: mint,
                  borderRadius: BorderRadius.circular(14.r),
                ),
                child: Row(
                  mainAxisAlignment: MainAxisAlignment.center,
                  children: [
                    Text(
                      'فتح الموقع على الخريطة',
                      style: GoogleFonts.cairo(
                        color: darkTeal,
                        fontSize: 11.5.sp,
                        fontWeight: FontWeight.w900,
                      ),
                    ),
                    SizedBox(width: 8.w),
                    Icon(Icons.map_outlined, color: teal, size: 20.sp),
                  ],
                ),
              ),
            ),
          ],
        ),
      );

  Widget _contactCircle({'''
          if "'فتح الموقع على الخريطة'" not in s:
              s = s.replace(anchor, button, 1)

          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/orders/driver_order_details_screen.dart
          if ! git diff --cached --quiet; then
            git commit -m "feat: open customer location in external Google Maps"
            git push origin HEAD:feature/delivery-zone-pricing
          fi
